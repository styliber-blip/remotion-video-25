name: Cloud Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx remotion render MyVideo out.mp4 --browser-executable=chromium
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out.mp4
